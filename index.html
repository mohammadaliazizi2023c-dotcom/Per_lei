<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Accesso al Contenuto</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f7f5f0;
    color: #1f1f1f;
    font-family: Georgia, serif;
    padding: 30px;
}

.container {
    width: 100%;
    max-width: 900px;
    text-align: center;
}

h1 {
    font-size: 1rem;
    font-weight: normal;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 60px;
    color: #444;
}

.main-text {
    font-size: 1.35rem;
    line-height: 1.8;
    margin-bottom: 50px;
}

#countdown {
    font-size: 3rem;
    font-weight: normal;
    margin-bottom: 50px;
}

.release-info {
    color: #666;
    line-height: 1.8;
    font-size: 1rem;
}

#videoSection {
    display: none;
    animation: fadeIn 1.2s ease;
}

.video-wrapper {
    position: relative;
    width: 100%;
    padding-bottom: 56.25%;
    height: 0;
    overflow: hidden;
    border-radius: 12px;
}

.video-wrapper iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
}

.available {
    margin-bottom: 40px;
    font-size: 1.2rem;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

</style>
</head>

<body>

<div class="container">

    <div id="waitingSection">

        <h1>Accesso al Contenuto</h1>

        <div class="main-text">
            La riproduzione del video sarà abilitata tra:
        </div>

        <div id="countdown"></div>

        <div class="release-info">
            Disponibile a partire da:<br>
            26 novembre 2026 · Test automatico (30 secondi)
        </div>

    </div>

    <div id="videoSection">

        <h1>Accesso al Contenuto</h1>

        <div class="available">
            Presentazione disponibile.
        </div>

        <div class="video-wrapper">
            <iframe id="videoFrame" allow="autoplay"></iframe>
        </div>

    </div>

</div>

<script>

// TEST: 30 secondi dal caricamento della pagina
const releaseDate = new Date(Date.now() + 30000);

// File ID codificato
const hiddenId =
"MUg3V25aaU5PRFgxVzQ5WlBjUF8waDdzUXdZNVVLNWRC";

let unlocked = false;

function unlockVideo() {

    if (unlocked) return;

    unlocked = true;

    const fileId = atob(hiddenId);

    const videoUrl =
        "https://drive.google.com/file/d/" +
        fileId +
        "/preview";

    document.getElementById("videoFrame").src = videoUrl;

    document.getElementById("waitingSection").style.display = "none";
    document.getElementById("videoSection").style.display = "block";

    clearInterval(timer);
}

function updateCountdown() {

    const diff = releaseDate - new Date();

    if (diff <= 0) {
        unlockVideo();
        return;
    }

    const seconds = Math.ceil(diff / 1000);

    document.getElementById("countdown").textContent =
        seconds + " s";
}

updateCountdown();

const timer = setInterval(updateCountdown, 1000);

</script>

</body>
</html>
