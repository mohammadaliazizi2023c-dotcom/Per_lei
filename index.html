<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unlock Test</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f8f7f4;
    color: #222;
    font-family: Georgia, serif;
}

.container {
    width: 100%;
    max-width: 900px;
    padding: 40px;
    text-align: center;
}

h1 {
    font-weight: 400;
    font-size: 3rem;
    margin-bottom: 20px;
}

.message {
    color: #666;
    font-size: 1.1rem;
    line-height: 1.8;
    margin-bottom: 40px;
}

#countdown {
    font-size: 2rem;
    letter-spacing: 2px;
}

#videoSection {
    display: none;
    margin-top: 30px;
    animation: fadeIn 1s ease;
}

.video-wrapper {
    position: relative;
    width: 100%;
    padding-bottom: 56.25%;
    height: 0;
    overflow: hidden;
}

.video-wrapper iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    border-radius: 12px;
}

.note {
    margin-top: 20px;
    color: #777;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(15px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>Testing</h1>

    <div class="message">
        This page will unlock automatically.
    </div>

    <div id="countdown"></div>

    <div id="videoSection">
        <div class="video-wrapper">
            <iframe id="videoFrame" allow="autoplay"></iframe>
        </div>

        <div class="note">
            Video unlocked successfully.
        </div>
    </div>

</div>

<script>

// 30 seconds from page load
const releaseDate = new Date(Date.now() + 30 * 1000);

// Base64-encoded file ID
const hidden =
"MUg3V25aaU5PRFgxVzQ5WlBjUF8waDdzUXdZNVVLNWRC";

let unlocked = false;

function unlockVideo() {

    if (unlocked) {
        return;
    }

    unlocked = true;

    const fileId = atob(hidden);

    const videoUrl =
        "https://drive.google.com/file/d/" +
        fileId +
        "/preview";

    document.getElementById("videoFrame").src = videoUrl;

    document.getElementById("countdown").style.display = "none";
    document.getElementById("videoSection").style.display = "block";

    clearInterval(timer);
}

function updateCountdown() {

    const diff = releaseDate - new Date();

    if (diff <= 0) {
        unlockVideo();
        return;
    }

    const seconds = Math.ceil(diff / 1000);

    document.getElementById("countdown").textContent =
        seconds + " seconds";
}

updateCountdown();

const timer = setInterval(updateCountdown, 1000);

</script>

</body>

</html>
