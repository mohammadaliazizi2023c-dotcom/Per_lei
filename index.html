<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Testing</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #faf9f7;
    color: #2d2d2d;
    font-family: Georgia, serif;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 900px;
    text-align: center;
}

h1 {
    font-weight: 400;
    font-size: 3rem;
    margin-bottom: 20px;
}

.message {
    color: #666;
    line-height: 1.8;
    margin-bottom: 40px;
}

#countdown {
    font-size: 2.5rem;
    letter-spacing: 2px;
}

#videoSection {
    display: none;
    margin-top: 30px;
}

.video-wrapper {
    position: relative;
    width: 100%;
    padding-bottom: 56.25%;
    height: 0;
    overflow: hidden;
    border-radius: 12px;
}

.video-wrapper iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: none;
}

.note {
    margin-top: 20px;
    color: #666;
    font-size: 1rem;
}
</style>
</head>

<body>

<div class="container">

    <h1>Testing</h1>

    <div class="message">
        This is a test of the countdown and unlock functionality.
    </div>

    <div id="countdown"></div>

    <div id="videoSection">

        <div class="video-wrapper">
            <iframe
                src="https://drive.google.com/file/d/1H7WnZiNODX1W49ZPcP_0h7sQwY5UK5dB/preview"
                allow="autoplay">
            </iframe>
        </div>

        <div class="note">
            The countdown has ended successfully.
        </div>

    </div>

</div>

<script>

// TEST: 5 minutes after page load
const releaseDate = new Date(Date.now() + 5 * 60 * 1000);

function updateCountdown() {

    const now = new Date();
    const diff = releaseDate - now;

    if (diff <= 0) {

        document.getElementById("countdown").style.display = "none";
        document.getElementById("videoSection").style.display = "block";

        return;
    }

    const minutes = Math.floor(diff / 1000 / 60);
    const seconds = Math.floor((diff / 1000) % 60);

    document.getElementById("countdown").textContent =
        `${minutes}m ${seconds}s`;
}

updateCountdown();
setInterval(updateCountdown, 1000);

</script>

</body>
</html>
